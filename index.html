      <p class="text-sm ${dot[t.c][1]} font-semibold">${L(t.date)}</p>
      <h3 class="text-xl font-bold text-white">${t.title}</h3>
      ${t.text ? `<p class="mt-1">${L(t.text)}</p>` : ""}
    </div>`).join("");
}
function renderExps(){
  $("#exps").innerHTML = exps.map(x=>`
    <article class="card glow rounded-2xl p-6 transition">
      <i class="fa-solid ${x.icon} text-2xl ${x.color}"></i>
      <h3 class="mt-3 text-lg font-bold text-white">${L(x.title)}</h3>
      <p class="text-sm text-slate-400">${L(x.sub)}</p>
      <p class="mt-3 text-sm leading-relaxed">${L(x.text)}</p>
    </article>`).join("");
}
function renderProjects(){
  $("#grid").innerHTML = projects.map((p,i)=>`
    <button data-i="${i}" class="card glow rounded-2xl p-6 text-left transition hover:-translate-y-1">
      <i class="fa-solid ${p.icon} text-2xl text-violet-400"></i>
      <h3 class="mt-3 text-lg font-bold text-white">${L(p.title)}</h3>
      <p class="mt-2 text-sm text-slate-400">${L(p.short)}</p>
      <div class="mt-4 flex flex-wrap gap-2">${L(p.tags).map(t=>`<span class="text-xs px-2.5 py-1 rounded-full bg-cyan-400/10 text-cyan-300">${t}</span>`).join("")}</div>
    </button>`).join("");
}
function renderSkills(){
  $("#tabs").innerHTML = skills.map((c,k)=>`<button role="tab" data-t="${k}" aria-selected="${k===tab}" class="tab px-4 py-2 rounded-full card text-sm font-medium transition ${k===tab?"active":""}">${L(c.name)}</button>`).join("");
  $("#badges").innerHTML = skills[tab].items.map((s,k)=>`<span class="card glow inline-flex items-center gap-2.5 px-4 py-2 rounded-full text-sm leading-none whitespace-nowrap transition hover:scale-105 cursor-default"><i class="${s.i} ${k%2?"text-violet-400":"text-cyan-400"}"></i>${L(s.n)}</span>`).join("");
}
function renderLangBtn(){
  const on="text-cyan-300 font-bold", off="text-slate-500";
  $("#lang").innerHTML = `<i class="fa-solid fa-globe text-violet-400"></i><span class="${lang==="en"?on:off}">EN</span><span class="text-slate-600">|</span><span class="${lang==="fr"?on:off}">FR</span>`;
  $("#lang").setAttribute("aria-label", T[lang].lang_aria);
}

/* Modale */
const modal = $("#modal");
function fillModal(i){
  const p = projects[i];
  $("#m-icon").className = "fa-solid "+p.icon+" text-3xl text-cyan-400";
  $("#m-title").textContent = L(p.title); $("#m-desc").textContent = L(p.desc);
  $("#m-tags").innerHTML = L(p.tags).map(t=>`<span class="text-xs px-2.5 py-1 rounded-full bg-violet-500/15 text-violet-300">${t}</span>`).join("");
  const gh = $("#m-gh"); if(p.github){ gh.href = p.github; gh.classList.remove("hidden"); } else { gh.classList.add("hidden"); }
}
function openModal(i){
  cur = i; lastFocus = document.activeElement; fillModal(i);
  modal.classList.remove("hidden"); document.body.style.overflow="hidden"; $("#m-close").focus();
}
function closeModal(){ cur = null; modal.classList.add("hidden"); document.body.style.overflow=""; lastFocus && lastFocus.focus(); }
$("#grid").addEventListener("click",e=>{ const b=e.target.closest("button[data-i]"); if(b) openModal(+b.dataset.i); });
$("#m-close").onclick = closeModal;
modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !modal.classList.contains("hidden")) closeModal(); });

/* Onglets */
$("#tabs").addEventListener("click",e=>{ const t=e.target.closest(".tab"); if(t){ tab=+t.dataset.t; renderSkills(); } });

/* Changement de langue (instantané, sans rechargement) */
function setLang(l){
  lang = l; const t = T[l];
  document.documentElement.lang = l;
  document.title = t.ttl;
  document.querySelector('meta[name="description"]').content = t.meta;
  document.querySelectorAll("[data-i]").forEach(el=>{ if(t[el.dataset.i] !== undefined && !el.dataset.t) el.innerHTML = t[el.dataset.i]; });
  document.querySelectorAll("[data-ph]").forEach(el=>{ el.placeholder = t[el.dataset.ph]; });
  $("#m-close").setAttribute("aria-label", t.close);
  $("#sent").classList.add("hidden");
  renderTimeline(); renderExps(); renderProjects(); renderSkills(); renderLangBtn();
  if(cur !== null) fillModal(cur);
}
$("#lang").onclick = ()=> setLang(lang==="en" ? "fr" : "en");

/* Apparition au scroll */
const io = new IntersectionObserver(es=>es.forEach(x=>{ if(x.isIntersecting){ x.target.classList.add("on"); io.unobserve(x.target);} }),{threshold:.12});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));

/* Menu mobile */
$("#burger").onclick = ()=>{ $("#mobmenu").classList.toggle("hidden"); $("#mobmenu").classList.toggle("flex"); };
$("#mobmenu").addEventListener("click",e=>{ if(e.target.tagName==="A"){ $("#mobmenu").classList.add("hidden"); $("#mobmenu").classList.remove("flex"); } });

/* Formulaire : envoi réel vers Formspree (action du <form>), sans rechargement */
$("#form").addEventListener("submit",async e=>{
  e.preventDefault();
  const f=e.target, out=$("#sent"), btn=f.querySelector("button");
  btn.disabled=true; btn.classList.add("opacity-60");
  try{
    const r = await fetch(f.action,{method:"POST",body:new FormData(f),headers:{Accept:"application/json"}});
    if(!r.ok) throw new Error();
    out.textContent = T[lang].ok; out.className = "text-sm text-cyan-300"; f.reset();
  }catch(err){
    out.textContent = T[lang].fail; out.className = "text-sm text-red-400";
  }
  btn.disabled=false; btn.classList.remove("opacity-60");
});

setLang("en"); // anglais par défaut
</script>
</body>
</html>
